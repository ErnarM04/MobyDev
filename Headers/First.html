<!DOCTYPE html>
<html>
    <head>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
            body{
                display: flex;
                align-items: center;
                flex-direction: row;
                justify-content: space-between;
                font-family: "Inter", sans-serif;
                padding: 12px 40px;
            }
            #logo{
                display: flex;
                align-items: center;
                max-width: fit-content;
                gap: 8px;
                cursor: pointer;
                user-select: none;
            }
            #logo img{
                width: 48px;
            }
            #logo p{
                font-weight: 900;
                font-size: x-large;
                margin: 0;
            }
            input{
                width: 352px;
                border: 1px solid #DFDFDF;
                border-radius: 8px;
                padding: 12px;
                font-weight: 400;
                font-size: 14px;
            }
            a{
                text-decoration: none;
            }
            #navigation{
                font-size: 14px;
                display: flex;
                gap: 40px;
                align-items: center;
            }
            #navigation button{
                background-color: black;
                color: white;
                font-weight: 600;
                border-radius: 8px;
                padding: 12px;
            }
        </style>
    </head>
    <body link="black" vlink="black" alink="#5C53E9">
        <div id="logo">
            <img src="https://www.nicepng.com/png/full/185-1859294_as-for-symbols-you-could-get-gorillaz-logo.png">
            <p>Logoipsum</p>
        </div>
        <input type="text" placeholder="Search">
        <div id="navigation">
            <a href="#">Products</a>
            <a href="#">Services</a>
            <a href="#">Expertise</a>
            <a href="#">About</a>
            <button>Login / Signup</button>
        </div>
    </body>
</html>
