<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            padding: 12px 36px;
            display: flex;
            background-color: #111928;
            color: white;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 50px;
            max-height: fit-content;
        }
        a {
            font-family: "Roboto", sans-serif;
            font-weight: 400;
            font-size: 16px;
            text-decoration: none;
        }
        input {
            border-radius: 10px;
            border: 1px #D6D8DE solid;
            color: #D6D8DE;
            padding: 10px;
            width: 100%;
            padding-left: 20px;
            background-color: inherit;
        }
        p {
            margin: 0;
        }
        img {
            height: 45px;
        }
        #logo {
            display: flex;
            flex-direction: row;
            gap: 6px;
            min-width: fit-content;
        }
        #logo div{
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #this-is {
            font-family: "Roboto", sans-serif;
            font-weight: 700;
            font-size: 12px;
        }
        #my-logo {
            font-family: "Roboto", sans-serif;
            font-weight: 900;
            font-size: 18px;
        }
        #nav {
            display: flex;
            flex-direction: row;
            gap: 40px;
            width: 100%;
            justify-content: flex-end;
        }
    </style>
</head>
<body link="white" vlink="white" alink="#5856D6">
    <div id="logo">
        <img src="https://simg.nicepng.com/png/small/185-1859294_as-for-symbols-you-could-get-gorillaz-logo.png">
        <div>
            <p id="this-is">THIS IS</p>
            <p id="my-logo">MY LOGO</p>
        </div>    
    </div>
    <input type="text" placeholder="Search...">
    <div id="nav">
        <a href="#">About</a>
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">Gallery</a>
        <a href="#">Team</a>
    </div>
</body>
</html>
