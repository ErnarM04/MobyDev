<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            padding: 12px 36px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        a {
            font-family: "Roboto", sans-serif;
            font-weight: 400;
            font-size: 16px;
            text-decoration: none;
        }
        p {
            margin: 0;
        }
        img {
            height: 45px;
        }
        #logo {
            display: flex;
            flex-direction: row;
            gap: 6px;
        }
        #logo div{
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #this-is {
            font-family: "Roboto", sans-serif;
            font-weight: 700;
            font-size: 12px;
        }
        #my-logo {
            font-family: "Roboto", sans-serif;
            font-weight: 900;
            font-size: 18px;
        }
        #nav {
            display: flex;
            flex-direction: row;
            gap: 40px;
        }
    </style>
</head>
